  <h2>History</h2>`+(ev.length?ev.map((e,i)=>{const prev=ev[i+1],d=prev&&(prev.max||5)===(e.max||5)?avg(e)-avg(prev):null;return `<div class="card"><small>${e.date||"No date"} · average ${avg(e).toFixed(1)}${e.max?"/"+e.max:""}${d!=null?` (${d>=0?"+":""}${d.toFixed(1)})`:""}</small>${bars(e)}${e.note?`<p>${esc(e.note)}</p>`:""}${delBtn("eval",e.id)}</div>`}).join(""):`<p class="empty">No evaluations for this player yet.</p>`);
}
function dashTab(){
  const cur=today().slice(0,7),mons=[...new Set([cur,...S.sessions.map(s=>String(s.date).slice(0,7))])].sort().reverse(),ym=mons.includes(S.dashm)?S.dashm:cur,start=ym+"-01",end=ym+"-31";
  const fm=s=>new Date(s+"T00:00:00Z").toLocaleDateString("en",{month:"short",day:"numeric",timeZone:"UTC"});
  const cards=teams().map(t=>{
    const reg=S.players.filter(p=>p.team===t),ids=new Set(reg.map(p=>p.id));
    const ss=S.sessions.filter(s=>s.team===t&&s.date>=start&&s.date<=end&&s.att&&Object.keys(s.att).length);
    const who=new Set();let best=null,bn=0;
    ss.forEach(s=>{const h=Object.keys(s.att).filter(id=>ids.has(id)&&(s.att[id]==="P"||s.att[id]==="L"));h.forEach(id=>who.add(id));if(h.length>bn){bn=h.length;best=s}});
    const pct=reg.length?Math.round(who.size/reg.length*100):0;
    return `<div class="card"><h3 style="margin-top:0">${esc(t)}</h3><div class="stats"><div><b>${reg.length}</b>registered</div><div><b>${who.size}</b>attended</div><div><b>${bn}</b>max per session</div></div><div class="bar" style="margin-top:10px"><div><i style="width:${pct}%"></i></div><span>${pct}%</span></div><small>${ss.length} sessions${best?" · busiest: "+fm(best.date):""}</small></div>`;
  }).join("");
  return `<h1>Dashboard</h1><div class="two"><select data-f="dashm" aria-label="Month">${mons.map(m=>`<option value="${m}" ${m===ym?"selected":""}>${monLbl(m)}</option>`).join("")}</select><span></span></div><small>Calendar month: ${monLbl(ym)}. Late counts as attended.</small><div style="height:10px"></div>${cards||'<p class="empty">No teams yet.</p>'}`;
}
function plansTab(){
  return `<h1>Session plans</h1><div class="card"><input id="plt" placeholder="Plan name (e.g. Baseline consistency)">
  <textarea id="plb" placeholder="One block per line: name, minutes, description&#10;Warm-up, 10, Mini tennis and dynamic stretching&#10;Drill, 20, Cross-court forehand rallies"></textarea><button class="pri" data-a="addPl">Save plan</button></div>`+
  (S.plans.length?S.plans.map(p=>`<div class="card"><b>${esc(p.title)}</b><small>${p.blocks.reduce((t,b)=>t+b.min,0)} min total</small>${p.blocks.map(b=>`<div class="pl"><b>${esc(b.name)}</b> · ${b.min} min<small>${esc(b.desc)}</small></div>`).join("")}${delBtn("plan",p.id)}</div>`).join(""):`<p class="empty">No plans yet.</p>`);
}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab&&!view));
  const keepY=window.scrollY;
  $("#app").innerHTML=view?(view.type==="player"?playerView():sessionView()):({dash:dashTab,players:playersTab,sessions:sessionsTab,eval:evalTab,plans:plansTab}[tab])();
  window.scrollTo(0,keepY);
}
const act={
  addP(){const n=val("#pn");if(!n)return;S.players.push({id:uid(),name:n,team:val("#pt"),level:$("#pl").value,contact:val("#pc")});S.grp=val("#pt")||NONE;save();render()},
  openP(d){view={type:"player",id:d.id};window.scrollTo(0,0);render()},
  openS(d){editOn=null;fltS="all";QA="";view={type:"session",id:d.id};window.scrollTo(0,0);render()},
  back(){view=null;arm=null;editOn=null;render()},
  toggleEdit(){editOn=editOn===view.id?null:view.id;arm=null;render()},
  saveS(){const s=S.sessions.find(x=>x.id===view.id);if(!s)return;s.title=val("#xt");s.date=val("#xd")||s.date;s.time=val("#xm");s.planId=$("#xp").value;editOn=null;save();render()},
  grp(d){S.grp=d.g;view=null;save();render()},
  addS(){S.sessions.push({id:uid(),title:val("#sti"),date:val("#sd")||today(),time:val("#st")||"17:00",team:curG()===NONE?"":curG(),planId:$("#sp").value,att:{},perf:{},notes:""});save();render()},
  att(d){const s=S.sessions.find(x=>x.id===view.id);s.att[d.id]=s.att[d.id]===d.v?undefined:d.v;if(!s.att[d.id])delete s.att[d.id];save();render()},
  addE(){const o={id:uid(),pid:evP,date:val("#ed")||today(),note:val("#en"),max:10};document.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=+i.value);S.evals.push(o);save();render()},
  addPl(){const t=val("#plt");if(!t)return;const blocks=val("#plb").split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(a=>a[0]).map(a=>({name:a[0],min:parseInt(a[1])||0,desc:a.slice(2).join(", ")}));S.plans.push({id:uid(),title:t,blocks});save();render()},
  del(d){
    if(arm!==d.id){arm=d.id;render();return}
    arm=null;
    if(d.t==="player"){S.players=S.players.filter(p=>p.id!==d.id);S.evals=S.evals.filter(e=>e.pid!==d.id);view=null}
    else if(d.t==="session"){S.sessions=S.sessions.filter(s=>s.id!==d.id);view=null}
    else if(d.t==="eval")S.evals=S.evals.filter(e=>e.id!==d.id);
    else S.plans=S.plans.filter(p=>p.id!==d.id);
    save();render();
  }
};
document.addEventListener("click",e=>{
  const n=e.target.closest("nav button");
  if(n){tab=n.dataset.t;view=null;arm=null;render();return}
  const t=e.target.closest("[data-a]");if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset);
});
document.addEventListener("change",e=>{
  const f=e.target.dataset.f;if(!f)return;
  if(f==="evp"){evP=e.target.value;render();return}
  if(f==="fltS"){fltS=e.target.value;render();return}
  if(f==="sortby"||f==="sortm"||f==="dashm"){S[f==="sortby"?"sort":f==="sortm"?"sortm":"dashm"]=e.target.value;save();render();return}
  const s=view&&S.sessions.find(x=>x.id===view.id);if(!s)return;
  if(f==="snote")s.notes=e.target.value;
  else{s.perf[e.target.dataset.id]=s.perf[e.target.dataset.id]||{};s.perf[e.target.dataset.id][f==="rate"?"r":"n"]=e.target.value}
  save();
});
document.addEventListener("input",e=>{if(e.target.id==="eq"){EQ=e.target.value;const pl=evList();if(pl.length&&!pl.some(p=>p.id===evP))evP=pl[0].id;const pos=e.target.selectionStart;render();const i=$("#eq");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}return}if(e.target.id==="qa"){QA=e.target.value;const w=norm(QA).split(/\s+/).filter(Boolean);let n=0;document.querySelectorAll("[data-n]").forEach(c=>{const ok=w.every(t=>c.dataset.n.includes(t));c.style.display=ok?"":"none";if(ok)n++});const m=$("#qae");if(m)m.style.display=n?"none":""}if(e.target.id==="q"){Q=e.target.value;const el=$("#plist");if(el)el.innerHTML=playersList()}});
booting=false;
render();
{const bar=document.createElement("div");bar.style.cssText="text-align:center;font:12px system-ui;opacity:.8;margin:12px 0 90px";
bar.innerHTML='<div id="stat" style="margin-bottom:6px"></div><button id="bk" style="font:inherit;padding:4px 12px;border-radius:8px;border:1px solid currentColor;background:none;color:inherit;margin:0 4px">Backup</button><button id="rs" style="font:inherit;padding:4px 12px;border-radius:8px;border:1px solid currentColor;background:none;color:inherit;margin:0 4px">Restore</button><br><select id="snp" aria-label="Auto-backups" style="font:inherit;width:auto;max-width:70%;margin:8px 0 0;padding:4px 8px"><option value="">Auto-backups</option></select><input id="rf" type="file" accept=".json,application/json" hidden>';
$("#app").after(bar);
$("#bk").onclick=async()=>{try{const name="coach-notebook-backup-"+today()+".json",file=new File([JSON.stringify(S)],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});S.lastBk=today();save();bkCheck();setStat("Backup saved "+today())}else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();S.lastBk=today();save();bkCheck();setStat("Backup saved "+today())}}catch(e){if(e&&e.name!=="AbortError")setStat("Backup not saved")}};
$("#snp").onchange=async e=>{const k=e.target.value;if(!k)return;if(!confirm("Replace current data with the backup from "+k.slice(5)+"?")){e.target.value="";return}try{const j=await kv("readonly",s=>s.get(k));const R=JSON.parse(j);if(!R||!Array.isArray(R.players))throw 0;S=Object.assign({players:[],sessions:[],plans:[],evals:[]},R);view=null;save();render();setStat("Restored backup "+k.slice(5))}catch(x){setStat("Could not restore that backup")}e.target.value=""};
